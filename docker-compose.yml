services:
  # The Gateway Container
  proxy:
    build: ./proxy
    ports:
      - "8000:80"
    depends_on:
      - model-phi3-container
      - model-tinyllama-container
    deploy:
      resources:
        limits:
          cpus: '1.0'        
          memory: 1G       

  # The First Model Container (Isolated)
  model-phi3-container:
    build: ./model_phi3
    container_name: model-phi3-container
    volumes:
      - phi3_data:/root/.ollama
    deploy:
      resources:
        limits:
          cpus: '6.0'        
          memory: 8G         
        # ---------------------------------------------------------
        # OPTIONAL: Uncomment the reservations block below to enable 
        # NVIDIA GPU acceleration. (Host must have NVIDIA drivers).
        # ---------------------------------------------------------
        # reservations:
        #   devices:
        #     - driver: nvidia
        #       count: all
        #       capabilities: [gpu]

  # The Second Model Container (Isolated)
  model-tinyllama-container:
    build: ./model_tinyllama
    container_name: model-tinyllama-container
    volumes:
      - tinyllama_data:/root/.ollama
    deploy:
      resources:
        limits:
          cpus: '4.0'        
          memory: 4G         
        # ---------------------------------------------------------
        # OPTIONAL: Uncomment the reservations block below to enable 
        # NVIDIA GPU acceleration. (Host must have NVIDIA drivers).
        # ---------------------------------------------------------
        # reservations:
        #   devices:
        #     - driver: nvidia
        #       count: all
        #       capabilities: [gpu]

# Declare the persistent storage volumes
volumes:
  phi3_data:
  tinyllama_data:
